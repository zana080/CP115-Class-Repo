name: Lab 06 Tests

on:
  push:
    paths:
      - 'labs/lab06/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/lab06

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # --- Exercise 1 ---
      - name: Exercise 1 - verify files exist
        if: always()
        run: test -f exercise1/exercise1.py
      - name: Exercise 1 - run tests
        if: always()
        run: python -m pytest exercise1/test/ --tb=no -q --no-header
